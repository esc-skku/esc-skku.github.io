<div class="eyebrow">CHAPTER 1 · INTRODUCTION</div>
<h1>McLeod 게이지 — 측정 순서</h1>
<p class="lede">알려진 부피의 기체를 수은으로 압축해, 압력을 <em>길이</em>로 바꿔 읽는 절대 게이지입니다. 아래 (a)&thinsp;→&thinsp;(b)&thinsp;→&thinsp;(c) 단계를 눌러가며 수은과 기체가 어떻게 움직이는지 확인해 보세요.</p>

<style>
.dot { width:7px;height:7px;border-radius:50%;background:var(--border-strong);display:inline-block;margin-right:6px; }
.dot.on { background:var(--text-accent); }
.nb { padding:6px 14px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-primary);border-radius:var(--radius);font-size:14px;cursor:pointer;font-family:inherit; }
.nb:disabled { opacity:.4;cursor:default; }
</style>

<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg"><title>McLeod 게이지의 측정 순서</title><desc>피스톤이 내려가면 실린더 수은면이 함께 내려가고, 그만큼의 수은이 저장조를 지나 벌브와 모세관으로 올라간다. 기체를 가둔 뒤 압축하여 높이차 h를 읽는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect id="gasCap" x="300" y="40" width="18" height="115" fill="#85B7EB"/>
<rect id="gasBulb" x="266" y="155" width="86" height="95" rx="12" fill="#85B7EB"/>
<rect id="gasStem" x="303" y="250" width="12" height="90" fill="#85B7EB"/>
<rect id="gasRef" x="390" y="40" width="18" height="300" fill="#85B7EB"/>
<rect id="gasRight" x="250" y="340" width="180" height="20" fill="#85B7EB"/>

<rect id="mWell" x="50" y="360" width="200" height="60" fill="#9A9A96"/>
<rect x="50" y="420" width="380" height="25" fill="#9A9A96"/>
<rect id="mRight" x="250" y="360" width="180" height="60" fill="#9A9A96"/>
<rect id="mStem" x="303" y="340" width="12" height="0" fill="#9A9A96"/>
<rect id="mBulb" x="266" y="250" width="86" height="0" fill="#9A9A96"/>
<rect id="mCap" x="300" y="155" width="18" height="0" fill="#9A9A96"/>
<rect id="mRef" x="390" y="340" width="18" height="0" fill="#9A9A96"/>

<rect x="300" y="40" width="18" height="115" fill="none" stroke="var(--t)" stroke-width="1.2"/>
<rect x="266" y="155" width="86" height="95" rx="12" fill="none" stroke="var(--t)" stroke-width="1.2"/>
<rect x="303" y="250" width="12" height="90" fill="none" stroke="var(--t)" stroke-width="1.2"/>
<rect x="390" y="40" width="18" height="300" fill="none" stroke="var(--t)" stroke-width="1.2"/>
<path d="M50 130 L50 445 L430 445 L430 340 L250 340 L250 130 M250 340 L250 420" fill="none" stroke="var(--t)" stroke-width="1.2"/>
<line x1="299" y1="40" x2="319" y2="40" stroke="var(--t)" stroke-width="3.5"/>

<rect id="plHead" x="50" y="346" width="200" height="14" rx="2" fill="#5F5E5A"/>
<rect id="plRod" x="142" y="200" width="16" height="146" fill="#5F5E5A"/>
<rect id="plWt" x="126" y="182" width="48" height="18" rx="2" fill="#5F5E5A"/>
<line id="plArr" x1="150" y1="140" x2="150" y2="166" stroke="#D85A30" stroke-width="2.5" marker-end="url(#arrow)" opacity="0"/>

<text class="th" x="399" y="16" font-size="18" text-anchor="middle" dominant-baseline="central">pᵢ</text>
<line x1="399" y1="26" x2="399" y2="38" stroke="var(--t)" stroke-width="1.2" marker-end="url(#arrow)"/>

<circle id="seal" cx="309" cy="340" r="9" fill="none" stroke="#D85A30" stroke-width="2" opacity="0"/>
<line class="leader" id="topline" x1="282" y1="40" x2="422" y2="40" opacity="0"/>
<line id="harrow" x1="352" y1="40" x2="352" y2="100" stroke="var(--t)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" opacity="0"/>
<text id="hlab" class="th" x="362" y="70" font-size="19" dominant-baseline="central" opacity="0">h</text>

<text id="tagCap" class="th" x="292" y="70" font-size="18" text-anchor="end" dominant-baseline="central"></text>
<text id="tagBulb" class="th" x="309" y="200" font-size="19" text-anchor="middle" dominant-baseline="central"></text>
<text class="ts" x="150" y="470" font-size="15" text-anchor="middle" dominant-baseline="central">피스톤 실린더</text>
<text class="ts" x="340" y="470" font-size="15" text-anchor="middle" dominant-baseline="central">저장조</text>
<text class="ts" x="445" y="180" font-size="15" dominant-baseline="central">기준 모세관</text>
<text class="ts" x="445" y="240" font-size="15" dominant-baseline="central">벌브 · 밀폐 모세관</text>
</svg>

<div style="display:flex;align-items:center;gap:14px;margin:6px 0 12px">
  <button class="nb" id="prev" onclick="go(-1)">이전</button>
  <button class="nb" id="next" onclick="go(1)">다음</button>
  <span><span class="dot on" id="d0"></span><span class="dot" id="d1"></span><span class="dot" id="d2"></span></span>
</div>

<div style="padding:14px;background:var(--surface-1);border:1px solid var(--border);border-radius:12px">
  <div id="st" style="font-size:17px;font-weight:500;color:var(--text-primary);margin-bottom:6px"></div>
  <div id="sd" style="font-size:15px;line-height:1.7;color:var(--text-secondary)"></div>
</div>

<script>
var S = [
 {lw:360, lr:360, arr:0, stem:0, bulb:0, cap:0, ref:0, seal:0, h:0, cap1:"", bulb1:"pᵢ",
  t:"(a) 챔버와 통해 있는 상태",
  d:"수은면이 관 입구보다 아래에 있어 벌브와 두 모세관이 모두 기체로 이어져 있습니다. 어디를 재도 압력은 챔버와 같은 pᵢ입니다."},
 {lw:390, lr:340, arr:1, stem:90, bulb:30, cap:0, ref:170, seal:1, h:0, cap1:"", bulb1:"p_f",
  t:"(b) 분기점이 막히며 기체가 갇힘",
  d:"피스톤이 내려간 만큼 실린더 수은면이 낮아지고, 그 수은이 저장조를 지나 관으로 올라갑니다. 분기점이 막히며 부피 Vᵢ가 확정됩니다. 벌브 쪽은 갇힌 기체가 밀어내 잘 못 올라가지만, 기준 모세관은 챔버(pᵢ)와 통해 있어 훨씬 높이 올라갑니다."},
 {lw:410, lr:340, arr:1, stem:90, bulb:95, cap:55, ref:300, seal:0, h:1, cap1:"p_f", bulb1:"",
  t:"(c) 압축한 뒤 높이차 h를 읽음",
  d:"기체가 모세관 끝으로 밀려 부피 V_f가 됩니다. 기준 모세관 수은을 밀폐 끝단 높이에 맞추면 두 수은면의 차 h가 곧 p_f(Torr)입니다. 보일 법칙에서 pᵢ = p_f·V_f/Vᵢ."}
];
var i = 0;
function setr(id, y, h){ var e=document.getElementById(id); e.setAttribute('y', y); e.setAttribute('height', h < 0 ? 0 : h); }
function render(){
  var s = S[i];
  setr('mWell', s.lw, 420-s.lw);
  setr('mRight', s.lr, 420-s.lr);
  setr('gasRight', 340, s.lr-340);
  setr('mStem', 340-s.stem, s.stem);
  setr('mBulb', 250-s.bulb, s.bulb);
  setr('mCap', 155-s.cap, s.cap);
  setr('mRef', 340-s.ref, s.ref);
  setr('gasStem', 250, 90-s.stem);
  setr('gasBulb', 155, 95-s.bulb);
  setr('gasCap', 40, 115-s.cap);
  setr('gasRef', 40, 300-s.ref);
  setr('plHead', s.lw-14, 14);
  setr('plRod', s.lw-160, 146);
  setr('plWt', s.lw-178, 18);
  document.getElementById('plArr').setAttribute('opacity', s.arr);
  document.getElementById('plArr').setAttribute('y1', s.lw-220);
  document.getElementById('plArr').setAttribute('y2', s.lw-194);
  document.getElementById('seal').setAttribute('opacity', s.seal);
  ['harrow','hlab','topline'].forEach(function(k){ document.getElementById(k).setAttribute('opacity', s.h); });
  document.getElementById('tagCap').textContent = s.cap1;
  document.getElementById('tagBulb').textContent = s.bulb1;
  document.getElementById('st').textContent = s.t;
  document.getElementById('sd').textContent = s.d;
  for (var k=0;k<3;k++) document.getElementById('d'+k).className = 'dot' + (k===i?' on':'');
  document.getElementById('prev').disabled = (i===0);
  document.getElementById('next').disabled = (i===2);
}
function go(d){ i = Math.max(0, Math.min(2, i+d)); render(); }
render();
</script>
