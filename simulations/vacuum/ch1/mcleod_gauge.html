<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>McLeod 게이지 — 연속 시뮬레이션</title>
<style>
  :root{
    --bg:#FBFAF7; --surface:#F1EFE9; --line:#B9B5AC; --ink:#1F1E1B; --ink-2:#5B5954;
    --hg:#8E8E8A; --gas:#7FB3E6; --piston:#4E4C48; --mark:#C4502A; --accent:#2B5F9E;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1B1B19; --surface:#26261F; --line:#5B5952; --ink:#EDEBE5; --ink-2:#B3B0A7;
           --hg:#B4B4AE; --gas:#4C86C4; --piston:#8A877F; --mark:#E56A3D; --accent:#8FB7E8; }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;}
  .wrap{max-width:720px;margin:0 auto;padding:18px 16px 32px;}
  h1{font-size:19px;font-weight:600;margin:0 0 12px;}
  svg{width:100%;height:auto;display:block;}
  .th{fill:var(--ink);font-size:18px;} .ts{fill:var(--ink-2);font-size:14px;}
  .out{fill:none;stroke:var(--ink);stroke-width:1.2;}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0;}
  .nb{padding:6px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
      border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit;}
  .nb.on{border-color:var(--accent);color:var(--accent);}
  .nb:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  label{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:8px;flex:1;min-width:220px;}
  input[type=range]{flex:1;accent-color:var(--accent);}
  .val{min-width:56px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);}
  .panel{padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:6px;}
  .panel .t{font-size:16px;font-weight:600;margin-bottom:6px;}
  .panel .d{font-size:14.5px;line-height:1.7;color:var(--ink-2);}
  .read{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;font-size:14px;}
  .read div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;}
  .read b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;}
  .note{font-size:12.5px;color:var(--ink-2);margin-top:10px;}
  @media (prefers-reduced-motion: reduce){ .anim-hint{display:none;} }
  nav.crumb{font-size:12.5px;color:var(--ink-2);margin-bottom:14px;}
  nav.crumb a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line);}
  nav.crumb a:hover{color:var(--accent);border-bottom-color:var(--accent);}
  nav.crumb span{margin:0 7px;color:var(--line);}
  footer{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-2);}
</style>
</head>
<body>
<div class="wrap">
<nav class="crumb"><a href="../../">시뮬레이션</a><span>/</span><a href="../">첨단 진공 물리 및 기술</a><span>/</span><a href="./">Chapter 1</a><span>/</span>McLeod 게이지</nav>
<h1>McLeod 게이지 — 피스톤을 직접 밀어보기</h1>

<svg viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>McLeod 게이지의 측정 순서</title>
  <desc>피스톤이 내려가면 실린더 수은면이 내려가고, 그만큼의 수은이 저장조를 지나 벌브와 모세관으로 올라간다. 분기점이 막히면 기체가 갇히고, 압축되어 높이차 h가 생긴다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <!-- gas (blue) -->
  <rect id="gasCap"  x="300" y="40"  width="18"  height="115" fill="var(--gas)"/>
  <rect id="gasBulb" x="266" y="155" width="86"  height="95" rx="12" fill="var(--gas)"/>
  <rect id="gasStem" x="303" y="250" width="12"  height="90"  fill="var(--gas)"/>
  <rect id="gasRef"  x="390" y="40"  width="18"  height="300" fill="var(--gas)"/>
  <rect id="gasRight" x="250" y="340" width="180" height="20" fill="var(--gas)"/>

  <!-- mercury (grey) -->
  <rect id="mWell"  x="50"  y="360" width="200" height="60" fill="var(--hg)"/>
  <rect x="50" y="420" width="380" height="25" fill="var(--hg)"/>
  <rect id="mRight" x="250" y="360" width="180" height="60" fill="var(--hg)"/>
  <rect id="mStem"  x="303" y="340" width="12"  height="0"  fill="var(--hg)"/>
  <rect id="mBulb"  x="266" y="250" width="86"  height="0"  fill="var(--hg)"/>
  <rect id="mCap"   x="300" y="155" width="18"  height="0"  fill="var(--hg)"/>
  <rect id="mRef"   x="390" y="340" width="18"  height="0"  fill="var(--hg)"/>

  <!-- glass outlines -->
  <rect class="out" x="300" y="40" width="18" height="115"/>
  <rect class="out" x="266" y="155" width="86" height="95" rx="12"/>
  <rect class="out" x="303" y="250" width="12" height="90"/>
  <rect class="out" x="390" y="40" width="18" height="300"/>
  <path class="out" d="M50 130 L50 445 L430 445 L430 340 L250 340 L250 130 M250 340 L250 420"/>
  <line x1="299" y1="40" x2="319" y2="40" stroke="var(--ink)" stroke-width="3.5"/>

  <!-- piston -->
  <rect id="plHead" x="50" y="346" width="200" height="14" rx="2" fill="var(--piston)"/>
  <rect id="plRod"  x="142" y="200" width="16"  height="146" fill="var(--piston)"/>
  <rect id="plWt"   x="126" y="182" width="48"  height="18" rx="2" fill="var(--piston)"/>
  <line id="plArr" x1="150" y1="140" x2="150" y2="166" stroke="var(--mark)" stroke-width="2.5" marker-end="url(#arrow)" opacity="0"/>

  <text class="th" x="399" y="16" text-anchor="middle" dominant-baseline="central">pᵢ</text>
  <line x1="399" y1="26" x2="399" y2="38" stroke="var(--ink)" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- annotations -->
  <circle id="seal" cx="309" cy="340" r="9" fill="none" stroke="var(--mark)" stroke-width="2" opacity="0"/>
  <line id="topline" x1="282" y1="40" x2="422" y2="40" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
  <line id="harrow" x1="352" y1="40" x2="352" y2="100" stroke="var(--ink)" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" opacity="0"/>
  <text id="hlab" class="th" x="362" y="70" dominant-baseline="central" opacity="0">h</text>
  <line id="vfbr" x1="326" y1="40" x2="326" y2="100" stroke="var(--accent)" stroke-width="2" opacity="0"/>
  <text id="vflab" x="332" y="70" fill="var(--accent)" font-size="15" dominant-baseline="central" opacity="0">V_f</text>
  <text id="tagBulb" class="th" x="309" y="200" text-anchor="middle" dominant-baseline="central"></text>

  <text class="ts" x="150" y="470" text-anchor="middle" dominant-baseline="central">피스톤 실린더</text>
  <text class="ts" x="340" y="470" text-anchor="middle" dominant-baseline="central">저장조</text>
  <text class="ts" x="445" y="180" dominant-baseline="central">기준 모세관</text>
  <text class="ts" x="445" y="240" dominant-baseline="central">벌브 · 밀폐 모세관</text>
</svg>

<div class="row">
  <button class="nb" id="ba" onclick="preset(0)">(a) 연결</button>
  <button class="nb" id="bb" onclick="preset(1)">(b) 밀봉</button>
  <button class="nb" id="bc" onclick="preset(2)">(c) 압축·읽기</button>
</div>
<div class="row">
  <label>피스톤 <input id="x" type="range" min="0" max="1000" value="0" step="1" oninput="onSlide()"><span class="val" id="xv">0%</span></label>
  <label>챔버 압력 pᵢ <input id="pi" type="range" min="2" max="14" value="6" step="0.5" oninput="onPi()"><span class="val" id="piv">6.0</span></label>
</div>

<div class="panel">
  <div class="t" id="st"></div>
  <div class="d" id="sd"></div>
  <div class="read">
    <div>Vᵢ / V_f <b id="rRatio">1.00</b></div>
    <div>h <b id="rH">0</b></div>
    <div>p_f = pᵢ + h <b id="rPf">6.0</b></div>
  </div>
  <div class="note">그림의 단위는 임의(px)이며, 1 px ≈ 1 mm Hg로 읽으면 h와 p_f가 Torr 단위가 된다. 실제 게이지는 pᵢ가 h보다 훨씬 작아 p_f ≈ h로 둔다.</div>
</div>
<footer>Electronic Structure Control Lab · Dept. of Physics, Sungkyunkwan University</footer>
</div>

<script>
// ---- geometry (px). y grows downward; heights measured upward from y=340 (branch) ----
var W_WELL=200, W_RIGHT=180, W_STEM=12, W_BULB=86, W_CAP=18, W_REF=18;
var H_RIGHT=20, H_STEM=90, H_BULB=95, H_CAP=115, H_REF=300;
var V_I = W_STEM*H_STEM + W_BULB*H_BULB + W_CAP*H_CAP;   // trapped gas volume at sealing
var D_SEAL = W_RIGHT*H_RIGHT;                              // displaced volume when reservoir reaches branch
var pi = 6;

// mercury volume in sealed side for a mercury column of height s above the branch
function Vm(s){
  if (s<=H_STEM) return W_STEM*s;
  if (s<=H_STEM+H_BULB) return W_STEM*H_STEM + W_BULB*(s-H_STEM);
  return W_STEM*H_STEM + W_BULB*H_BULB + W_CAP*(s-H_STEM-H_BULB);
}
function state(s){                   // given sealed-side column s -> {s, r, pf, ratio, Vf}
  var Vf = V_I - Vm(s), pf = pi*V_I/Vf, h = pf - pi;
  return {s:s, r:s+h, pf:pf, h:h, ratio:V_I/Vf, Vf:Vf};
}
function excess(s){ var st=state(s); return Vm(s) + W_REF*st.r; }   // displaced volume beyond D_SEAL
function solveS(E){                  // bisection on s for excess(s)=E
  var lo=0, hi=H_STEM+H_BULB+H_CAP-1;
  for (var k=0;k<50;k++){ var mid=(lo+hi)/2; if (excess(mid)<E) lo=mid; else hi=mid; }
  return (lo+hi)/2;
}
function sMax(){                     // s at which reference column reaches its top (r = H_REF)
  var lo=0, hi=H_STEM+H_BULB+H_CAP-1;
  for (var k=0;k<50;k++){ var mid=(lo+hi)/2; if (state(mid).r<H_REF) lo=mid; else hi=mid; }
  return lo;
}
function Dmax(){ return D_SEAL + excess(sMax()); }

function setr(id,y,h){ var e=document.getElementById(id); e.setAttribute('y',y); e.setAttribute('height',h<0?0:h); }
function op(id,v){ document.getElementById(id).setAttribute('opacity',v); }
function ln(id,y1,y2){ var e=document.getElementById(id); e.setAttribute('y1',y1); e.setAttribute('y2',y2); }

var TXT=[
 ["(a) 챔버와 통해 있는 상태","수은면이 분기점보다 아래에 있어 벌브와 두 모세관이 모두 기체로 이어져 있습니다. 어디를 재도 압력은 챔버와 같은 pᵢ입니다."],
 ["(b) 분기점이 막히며 기체가 갇힘","피스톤이 내려간 만큼 실린더 수은면이 낮아지고, 그 수은이 저장조를 지나 관으로 올라갑니다. 분기점이 막히는 순간 부피 Vᵢ가 확정됩니다. 벌브 쪽은 갇힌 기체가 밀어내 잘 못 올라가지만, 기준 모세관은 챔버(pᵢ)와 통해 있어 더 높이 올라갑니다."],
 ["(c) 압축한 뒤 높이차 h를 읽음","기체가 모세관 끝으로 밀려 부피 V_f가 됩니다. 두 수은면의 차 h가 곧 p_f − pᵢ(Torr)이고, 보일 법칙에서 pᵢ = p_f·V_f/Vᵢ. pᵢ ≪ h이면 p_f ≈ h로 읽습니다."]
];

function render(frac){               // frac in [0,1] -> displaced volume D
  var D = frac*Dmax(), lw, lr, s=0, r=0, st=null;
  lw = 360 + D/W_WELL;
  if (D<=D_SEAL){ lr = 360 - D/W_RIGHT; }
  else { lr = 340; s = solveS(D-D_SEAL); st = state(s); r = st.r; }

  setr('mWell', lw, 420-lw);
  setr('mRight', lr, 420-lr);  setr('gasRight', 340, lr-340);
  var stem=Math.min(s,H_STEM), bulb=Math.min(Math.max(s-H_STEM,0),H_BULB), cap=Math.max(s-H_STEM-H_BULB,0);
  setr('mStem',340-stem,stem);   setr('gasStem',250,H_STEM-stem);
  setr('mBulb',250-bulb,bulb);   setr('gasBulb',155,H_BULB-bulb);
  setr('mCap',155-cap,cap);      setr('gasCap',40,H_CAP-cap);
  setr('mRef',340-r,r);          setr('gasRef',40,H_REF-r);
  setr('plHead',lw-14,14); setr('plRod',lw-160,146); setr('plWt',lw-178,18);
  op('plArr', frac>0.02 && frac<0.98 ? 1 : 0); ln('plArr',lw-220,lw-194);

  var phase = D<=D_SEAL ? 0 : (cap>0 ? 2 : 1);
  op('seal', phase===1 ? 1 : 0);
  var showH = phase===2;
  op('topline',showH?1:0); op('harrow',showH?1:0); op('hlab',showH?1:0); op('vfbr',showH?1:0); op('vflab',showH?1:0);
  if (showH){
    var yTopGas=40, yHgCap=155-cap, yRef=340-r;
    ln('harrow', yRef, yHgCap); document.getElementById('hlab').setAttribute('y',(yRef+yHgCap)/2);
    ln('vfbr', yTopGas, yHgCap); document.getElementById('vflab').setAttribute('y',(yTopGas+yHgCap)/2);
  }
  document.getElementById('tagBulb').textContent = phase===0 ? 'pᵢ' : (phase===1 ? 'p' : '');

  document.getElementById('st').textContent = TXT[phase][0];
  document.getElementById('sd').textContent = TXT[phase][1];
  ['ba','bb','bc'].forEach(function(id,k){ document.getElementById(id).className='nb'+(k===phase?' on':''); });

  document.getElementById('rRatio').textContent = st ? st.ratio.toFixed(2) : '1.00';
  document.getElementById('rH').textContent = st ? Math.round(st.h) : 0;
  document.getElementById('rPf').textContent = st ? st.pf.toFixed(1) : pi.toFixed(1);
  document.getElementById('xv').textContent = Math.round(frac*100)+'%';
}

var cur=0, animId=null;
function onSlide(){ if (animId) cancelAnimationFrame(animId), animId=null; cur=document.getElementById('x').value/1000; render(cur); }
function onPi(){ pi=parseFloat(document.getElementById('pi').value); document.getElementById('piv').textContent=pi.toFixed(1); render(cur); }
function animateTo(target){
  if (animId) cancelAnimationFrame(animId);
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ cur=target; document.getElementById('x').value=Math.round(cur*1000); render(cur); return; }
  var from=cur, t0=performance.now(), dur=650+Math.abs(target-from)*500;
  function step(t){
    var u=Math.min(1,(t-t0)/dur), e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    cur=from+(target-from)*e; document.getElementById('x').value=Math.round(cur*1000); render(cur);
    if (u<1) animId=requestAnimationFrame(step); else animId=null;
  }
  animId=requestAnimationFrame(step);
}
function preset(k){
  var D = k===0 ? 0 : (k===1 ? D_SEAL + excess(120) : Dmax());   // (b): stem full + part of bulb
  animateTo(D/Dmax());
}
render(0);
</script>
</body>
</html>
