<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESC Lab 장비 도면 — 7개의 레이어</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --bg:#101211; --paper:#1a1d1b; --ink:#e8ece9; --muted:#a8b0aa; --line:#2c302d;
  --grid:rgba(232,236,233,.06);
  --steel:#3E4850; --steel-ink:#A3ADB5;
  --c-water:#6A9BF2; --c-elec:#F0B33E; --c-signal:#D9B36A; --c-lock:#F06A6A;
  --c-vac:#B094E6; --c-gas:#62C78A; --c-air:#F2925E; --c-cryo:#5FD1E2;
  --btn:#e8ece9; --btn-ink:#101211;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR","Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 40px}
header h1{font-size:1.35rem;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0 0 20px;color:var(--muted);max-width:60ch}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.board{background:var(--paper);border:1px solid var(--line);border-radius:6px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;overflow:hidden}
.board svg{display:block;width:100%;height:auto;max-width:100%}
.panel{display:flex;flex-direction:column;gap:14px}
.layers{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--paper);overflow:hidden}
.layers li{border-top:1px solid var(--line)}
.layers li:first-child{border-top:0}
.layers button{all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;cursor:pointer;color:var(--ink);font:inherit}
.layers button:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.layers button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.layers li[aria-current="true"] button{background:color-mix(in srgb,var(--ink) 9%,transparent);font-weight:600}
.sw{width:14px;height:14px;border-radius:3px;background:var(--sw,var(--steel));flex:none;opacity:.35;transition:opacity .25s}
li.lit .sw{opacity:1}
.idx{color:var(--muted);font-variant-numeric:tabular-nums;width:1.2em;font-size:.9em}
.subs{display:none;gap:6px;padding:0 12px 10px 36px;flex-wrap:wrap}
li[aria-current="true"] .subs{display:flex}
.chip{all:unset;cursor:pointer;font-size:.85em;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--sw);opacity:.3}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--sw)}
.chip[aria-pressed="true"] i{opacity:1}
.chip:focus-visible{outline:2px solid var(--ink)}
.desc{min-height:7.5em;padding:2px 2px 0}
.desc h2{font-size:1.05rem;margin:0 0 6px;font-weight:600}
.desc p{margin:0;color:var(--muted)}
.nav{display:flex;gap:8px;align-items:center}
.nav button{all:unset;cursor:pointer;padding:8px 16px;border-radius:5px;border:1px solid var(--line);font:inherit;color:var(--ink)}
.nav button.next{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.nav button:disabled{opacity:.4;cursor:default}
.nav button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.nav .sp{flex:1}
.mode{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:.9em;flex-wrap:wrap}
.mode label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.hint{color:var(--muted);font-size:.85em;margin:0}
@media (max-width:860px){.stage{grid-template-columns:1fr}.desc{min-height:0}}

/* ---- SVG ---- */
text{font-family:inherit;fill:var(--ink);font-size:12px}
text.small{font-size:10.5px;fill:var(--muted)}
text.tag{font-size:10.5px;font-weight:500}
.eq{fill:var(--steel);stroke:var(--steel-ink);stroke-width:1.2}
.arm{stroke:var(--steel-ink);stroke-width:4;stroke-linecap:round}
.stub{stroke:var(--steel-ink);stroke-width:5}
.gv{fill:var(--steel-ink)}
.base-only .dim{opacity:.55}

.layer{opacity:0;transition:opacity .35s}
.layer.on{opacity:1}
.layer path,.layer line,.layer polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.layer circle.ln{fill:none}
.layer .ln{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .9s ease}
.layer.on .ln{stroke-dashoffset:0}
.layer .dot{transition:transform .3s ease .5s;transform-box:fill-box;transform-origin:center;transform:scale(0)}
.layer.on .dot{transform:scale(1)}
.layer .lbl{opacity:0;transition:opacity .3s ease .55s}
.layer.on .lbl{opacity:1}
#l-water{--c:var(--c-water)} #l-power{--c:var(--c-elec)} #l-signal{--c:var(--c-signal)}
#l-lock{--c:var(--c-lock)} #l-vac{--c:var(--c-vac)} #l-gas{--c:var(--c-gas)}
#l-air{--c:var(--c-air)} #l-cryo{--c:var(--c-cryo)}
.layer .ln{stroke:var(--c)}
.layer .dot,.layer .fill{fill:var(--c)}
.layer .hl{fill:color-mix(in srgb,var(--c) 22%,transparent);stroke:var(--c);stroke-width:1.6}
.layer .vf{fill:color-mix(in srgb,var(--c) 18%,transparent);stroke:none}
.layer .vs{stroke:color-mix(in srgb,var(--c) 45%,transparent);stroke-width:5;stroke-linecap:butt}
.layer text.tag{fill:var(--c)}
.layer text.tmp{font-size:7.5px;font-weight:600;fill:var(--c);text-anchor:middle;letter-spacing:.02em}
#l-signal .ln{stroke-width:1.3;stroke-dasharray:4 3}
#l-signal.on .ln{stroke-dashoffset:0}
#l-lock .ln{stroke-width:1.4;stroke-dasharray:2 4}
#l-lock.on .ln{stroke-dashoffset:0}
#l-lock .out{stroke-dasharray:none;stroke-width:2.2}
@keyframes pulse{0%,100%{r:9}50%{r:13}}
#l-lock.on .node{animation:pulse 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .layer,.layer .ln,.layer .dot,.layer .lbl{transition:none}
  #l-lock.on .node{animation:none}
}
nav.crumb{font-size:12.5px;color:var(--muted);margin:0 0 14px}
nav.crumb a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
nav.crumb a:hover{color:var(--ink);border-bottom-color:var(--ink)}
nav.crumb span{margin:0 7px;color:var(--line)}
footer{margin-top:32px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
</style>
</head>

/* ---- sound (synthesized, no files) ---- */
let ac = null, soundOn = true;
function tone(freq, {dur=0.22, wave="sine", gain=0.18, at=0}={}){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    const t = ac.currentTime + at;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = wave; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t+dur+0.03);
  }catch(e){}
}
function playLayer(L){
  if(L.chord){ L.chord.forEach((f,i)=>tone(f,{dur:0.5,wave:"sine",gain:0.12,at:i*0.07})); return; }
  const g = L.wave==="square"||L.wave==="sawtooth" ? 0.07 : 0.18;
  tone(L.note,{wave:L.wave,gain:g});
}
function tick(on){ tone(on?880:600,{dur:0.07,wave:"sine",gain:0.1}); }

    for(const t of toks){
      const c=t[0], n=t.slice(1).trim().split(/[\s,]+/).filter(Boolean).map(Number);
      if(c==="M"){x=n[0];y=n[1];pts.push([x,y]);}
      else if(c==="H"){x=n[0];pts.push([x,y]);}
      else if(c==="V"){y=n[0];pts.push([x,y]);}
      else if(c==="L"){x=n[0];y=n[1];pts.push([x,y]);}
      else return null;
    }
    return pts;
  };
  const items = [];
  svg.querySelectorAll("#base line.arm, #base line.stub").forEach(el=>{
    items.push({el, order:-1, pts:[[+el.getAttribute("x1"),+el.getAttribute("y1")],[+el.getAttribute("x2"),+el.getAttribute("y2")]], hop:false});
  });
  svg.querySelectorAll("#base path").forEach(el=>{
    const pts = parseD(el.getAttribute("d")||""); if(pts) items.push({el, order:-1, pts, hop:false});
  });
  let order = 0;
  svg.querySelectorAll(".layer path.ln").forEach(el=>{
    const pts = parseD(el.getAttribute("d")||""); if(pts) items.push({el, order:order++, pts, hop:true});
  });
  // segment intersection → distance along p (from p1) and along q
  const cross = (p1,p2,q1,q2) => {
    const rx=p2[0]-p1[0], ry=p2[1]-p1[1], sx=q2[0]-q1[0], sy=q2[1]-q1[1];
    const den = rx*sy - ry*sx; if(Math.abs(den) < 1e-9) return null;
    const qx=q1[0]-p1[0], qy=q1[1]-p1[1];
    const t=(qx*sy - qy*sx)/den, u=(qx*ry - qy*rx)/den;
    const lp=Math.hypot(rx,ry), lq=Math.hypot(sx,sy);
    const dp=t*lp, dq=u*lq;
    if(dp<EPS || dp>lp-EPS || dq<EPS || dq>lq-EPS) return null;
    return dp;
  };
  for(const P of items){
    if(!P.hop) continue;
    let d = `M${P.pts[0][0]},${P.pts[0][1]}`;
    let changed = false;
    for(let i=0;i<P.pts.length-1;i++){
      const a=P.pts[i], b=P.pts[i+1];
      const len=Math.hypot(b[0]-a[0], b[1]-a[1]);
      if(len<1e-6) continue;
      const ux=(b[0]-a[0])/len, uy=(b[1]-a[1])/len;
      let hops=[];
      for(const Q of items){
        if(Q===P || Q.order>=P.order) continue;
        for(let j=0;j<Q.pts.length-1;j++){
          const dp = cross(a,b,Q.pts[j],Q.pts[j+1]);
          if(dp!==null) hops.push(dp);
        }
      }
      hops.sort((x,y)=>x-y);
      // merge hops closer than 2R into one wider arc
      const spans=[];
      for(const h of hops){
        const last=spans[spans.length-1];
        if(last && h-R <= last[1]) last[1]=h+R; else spans.push([h-R,h+R]);
      }
      for(const [s0,s1] of spans){
        const x0=a[0]+ux*s0, y0=a[1]+uy*s0, x1=a[0]+ux*s1, y1=a[1]+uy*s1;
        const rx=(s1-s0)/2;
        d += ` L${x0.toFixed(1)},${y0.toFixed(1)} A${rx.toFixed(1)},${R} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}`;
        changed = true;
      }
      d += ` L${b[0]},${b[1]}`;
    }
    if(changed) P.el.setAttribute("d", d);
  }
})();

/* ---- state & render ---- */
let idx = 0, cumulative = true;
const subOn = {"l-power":true,"l-signal":true,"l-lock":true};
const list = document.getElementById("layers");
const desc = document.getElementById("desc");
const count = document.getElementById("count");
const prev = document.getElementById("prev"), next = document.getElementById("next");

layers.forEach((L,i)=>{
  const li = document.createElement("li");
  const b = document.createElement("button"); b.type="button";
  b.innerHTML = `<span class="sw" style="--sw:${L.sw}"></span><span class="idx">${i}</span><span>${L.name}</span>`;
  b.addEventListener("click",()=>go(i));
  li.appendChild(b);
  if(L.subs){
    const s = document.createElement("div"); s.className="subs";
    L.subs.forEach(S=>{
      const c = document.createElement("button"); c.type="button"; c.className="chip";
      c.style.setProperty("--sw",S.sw); c.setAttribute("aria-pressed","true");
      c.innerHTML = `<i></i>${S.name}`;
      c.addEventListener("click",e=>{ e.stopPropagation(); subOn[S.id]=!subOn[S.id]; c.setAttribute("aria-pressed",String(subOn[S.id])); tick(subOn[S.id]); render(); });
      s.appendChild(c);
    });
    li.appendChild(s);
  }
  list.appendChild(li);
});

function go(i){ idx=i; playLayer(layers[idx]); render(); }

function activeGroups(){
  const on = new Set();
  layers.forEach((L,i)=>{
    const show = cumulative ? i<=idx : i===idx;
    if(!show || !L.groups) return;
    L.groups.forEach(g=>{ if(subOn[g]!==false) on.add(g); });
  });
  return on;
}
function render(){
  const on = activeGroups();
  document.querySelectorAll(".layer").forEach(g=>g.classList.toggle("on",on.has(g.id)));
  document.getElementById("base").classList.toggle("base-only", idx===0);
  [...list.children].forEach((li,i)=>{
    li.setAttribute("aria-current", i===idx ? "true":"false");
    const lit = i===0 || (cumulative ? i<=idx : i===idx) || idx===layers.length-1;
    li.classList.toggle("lit", lit);
  });
  const L = layers[idx];
  desc.innerHTML = `<h2>${L.name}</h2><p>${L.desc}</p>`;
  count.textContent = `${idx} / ${layers.length-1}`;
  prev.disabled = idx===0;
  next.textContent = idx===layers.length-1 ? "처음으로" : "다음 레이어";
}

prev.addEventListener("click",()=>{ if(idx>0) go(idx-1); });
next.addEventListener("click",()=>go(idx===layers.length-1 ? 0 : idx+1));
document.getElementById("cum").addEventListener("change",e=>{ cumulative=e.target.checked; tick(cumulative); render(); });
document.getElementById("snd").addEventListener("change",e=>{ soundOn=e.target.checked; if(soundOn) tick(true); });
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); next.click(); }
  if(e.key==="ArrowLeft"){ e.preventDefault(); prev.click(); }
});
render();
</script>
